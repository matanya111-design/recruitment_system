services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidate_manager
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d candidate_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin change-me &&
        mc mb --ignore-existing local/candidate-cv &&
        mc anonymous set none local/candidate-cv &&
        echo 'MinIO bucket ready'
      "

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://app:change-me@postgres:5432/candidate_manager
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups
        echo '#!/bin/sh' > /usr/local/bin/backup.sh
        echo 'FILE=/backups/backup_$(date +%Y-%m-%d_%H-%M).sql.gz' >> /usr/local/bin/backup.sh
        echo 'PGPASSWORD=change-me pg_dump -h postgres -U app candidate_manager | gzip > "$$FILE" && echo "Backup saved: $$FILE"' >> /usr/local/bin/backup.sh
        echo 'find /backups -name "*.sql.gz" -mtime +7 -delete' >> /usr/local/bin/backup.sh
        chmod +x /usr/local/bin/backup.sh
        echo '0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root
        /usr/local/bin/backup.sh
        crond -f

volumes:
  postgres_data:
  minio_data:
